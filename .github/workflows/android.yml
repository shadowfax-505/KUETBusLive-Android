name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The Firebase config lives in the GOOGLE_SERVICES_JSON secret, not in git. Without
      # it the app still builds and shows its "setup needed" screen.
      - name: Add the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "HAS_FIREBASE=true" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: kuet-bus-live-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Every push to main with the Firebase config updates one installable demo build.
      - name: Publish the demo APK
        if: github.ref == 'refs/heads/main' && env.HAS_FIREBASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KUETBusLive-Android-demo.apk
          gh release view android-demo > /dev/null 2>&1 || gh release create android-demo \
            --prerelease --target main --title "Android demo build" \
            --notes "The latest debug build from main, connected to the KUET Bus Live Firebase project. Open this page on an Android phone, download the APK and install it (allow installs from your browser when asked)."
          gh release upload android-demo KUETBusLive-Android-demo.apk --clobber
