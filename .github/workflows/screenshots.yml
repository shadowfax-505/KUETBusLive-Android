name: Screenshots

# Renders the main screens on an emulator with made-up data (Firebase emulators,
# no real project) and uploads the pictures. Run it by hand from the Actions tab,
# or by pushing to the "screenshots" branch.
on:
  workflow_dispatch:
  push:
    branches: [screenshots]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Firebase emulators
        working-directory: .github/showcase
        run: |
          npm install -g firebase-tools@13
          firebase emulators:start --only auth,firestore --project demo-kuetbuslive > emulators.log 2>&1 &
          for i in $(seq 1 60); do curl -s localhost:8080 > /dev/null && curl -s localhost:9099 > /dev/null && break; sleep 2; done
          tail -5 emulators.log

      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run the tour
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          script: ./.github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            instrument.log
            .github/showcase/emulators.log

      # Also keep the pictures in git, on the screenshots branch, for the README.
      - name: Save the pictures on the screenshots branch
        if: always()
        run: |
          [ -n "$(ls screenshots/*.png 2>/dev/null)" ] || exit 0
          git config user.name "Muttakin Rahman Shoscho"
          git config user.email "143033286+shadowfax-505@users.noreply.github.com"
          git fetch origin screenshots
          git checkout -B screenshots origin/screenshots
          mkdir -p docs/screenshots/android
          cp screenshots/*.png screenshots/log.txt instrument.log docs/screenshots/android/ 2>/dev/null || true
          git add docs/screenshots/android
          git commit -m "Update the Android screenshots" || exit 0
          git push origin screenshots
